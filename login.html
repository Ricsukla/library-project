<!DOCTYPE html>
<html>
<head>
<title>Login</title>

<style>
body{
margin:0;
font-family:Arial;
background:#0f0f0f;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
color:#f5d76e;
}

.card{
background:#1c1c1c;
padding:30px;
border-radius:12px;
width:320px;
text-align:center;
box-shadow:0 0 15px rgba(201,162,39,0.4);
}

h2{
color:#f5d76e;
}

input{
width:100%;
padding:10px;
margin:10px 0;
border:1px solid #c9a227;
border-radius:5px;
background:#0f0f0f;
color:#f5d76e;
}

input::placeholder{
color:#aaa; 
}

button{
width:100%;
padding:10px;
background:#c9a227;
color:black;
border:none;
border-radius:5px;
cursor:pointer;
font-weight:bold;
}

button:hover{
background:#e6c55c;
}

a{
display:block;
margin-top:10px;
color:#f5d76e;
text-decoration:none;
}

a:hover{
text-decoration:underline;
}
</style>

</head>

<body>

<div class="card">
<h2>Login</h2>

<input id="email" placeholder="Email">
<input id="password" type="password" placeholder="Password">

<button onclick="login()">Login</button>

<a href="signup.html">Create Account</a>
</div>

<script>
function login(){

let email = document.getElementById("email").value;
let password = document.getElementById("password").value;

const API = "https://library-project.onrender.com";

fetch(`${API}/login`,{method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify({email:email,password:password})
})
.then(res=>res.json())
.then(data=>{

    console.log("LOGIN RESPONSE:", data);   

    if(data.message=="success" && data.user){

        localStorage.setItem("user_id", data.user.user_id);
        localStorage.setItem("name", data.user.name);

        window.location.href="dashboard.html";

    }else{
        alert("Invalid credentials");
    }

})
.catch(err=>{
    console.error("Login error:", err);
    alert("Server error");
});

}
</script>

</body>
</html>
